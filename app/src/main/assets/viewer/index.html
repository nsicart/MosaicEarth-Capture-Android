<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'unsafe-inline'; worker-src 'self' blob:; child-src 'self' blob:">
<title>Visor 3D &amp; Geoespacial · MosaicEarth Capture</title>
<style>
* { box-sizing: border-box; }
html, body, main {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #090f0b;
  color: #eef5f0;
  font: 13.5px/1.35 system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}
main { position: relative; touch-action: none; }
main > canvas:not(.raster-view) { display: block; width: 100%; height: 100%; outline: none; }
nav#toolbar {
  position: fixed;
  z-index: 10;
  left: 10px;
  top: 10px;
  right: 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  pointer-events: none;
}
.hud-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  pointer-events: auto;
}
button {
  color: #eef5f0;
  background: rgba(17, 27, 20, 0.9);
  border: 1px solid #2e4635;
  padding: 6px 11px;
  border-radius: 8px;
  font: 600 12.5px/1.2 system-ui, sans-serif;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
button.primary {
  border-color: rgba(153, 204, 0, 0.6);
  color: #b7eb28;
}
button.active {
  background: #99cc00;
  color: #0b1308;
  border-color: #99cc00;
}
button:disabled { opacity: 0.45; cursor: default; }
#stats {
  pointer-events: none;
  background: rgba(13, 21, 16, 0.88);
  border: 1px solid #263a2c;
  color: #9fb2a5;
  padding: 5px 10px;
  border-radius: 999px;
  font: 600 11.5px/1.2 system-ui, sans-serif;
}
#stats strong { color: #99cc00; font-weight: 700; }
#status {
  position: fixed;
  z-index: 10;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: rgba(17, 27, 20, 0.94);
  border: 1px solid rgba(153, 204, 0, 0.45);
  border-radius: 10px;
  padding: 11px 14px;
  color: #eef5f0;
  font-weight: 500;
}
canvas.raster-view { width: 100%; height: 100%; display: block; touch-action: none; }
</style>
<script defer src="./bundle.js"></script>
</head>
<body>
<main aria-label="Visor 3D i Geoespacial"></main>
<nav id="toolbar">
  <div class="hud-group" id="controls">
    <button id="reset" class="primary" disabled>Centra vista</button>
  </div>
  <div id="stats" hidden></div>
</nav>
<div id="status" role="status">Carregant l’actiu 3D / geoespacial…</div>
</body>
</html>
